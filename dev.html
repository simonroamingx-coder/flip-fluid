	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>FLIP Fluid</title>
		<link rel="stylesheet" href="src/styles/app.css">

		<!-- build:dev-only -->
		<!--
			Development entry point. It loads the modules in src/, so it has to be
			served over http: browsers refuse to fetch module scripts from file://
			pages. Opening it from disk would otherwise give a blank canvas with
			no reason why, which this notices and explains. index.html - the
			generated single-file build - is the one that runs by double-click.
		-->
		<!-- /build:dev-only -->
		<script>
			window.addEventListener('load', function () {
				setTimeout(function () {
					if (window.__flip)
						return;

					var fromDisk = location.protocol === 'file:' &&
						document.querySelector('script[type="module"]');

					var notice = document.createElement('div');
					notice.style.cssText = 'font-family: verdana; font-size: 14px; color: #900;' +
						' border: 2px solid #900; padding: 10px; margin: 10px 0; max-width: 900px;';
					notice.textContent = 'The simulation did not start. ' +
						(fromDisk
							? 'This is the development page, and opening it straight from disk cannot work: ' +
							  'it loads its code as modules, which browsers refuse to fetch from file:// pages. ' +
							  'Run "node tools/serve.mjs" and open http://localhost:8080/dev.html, or just open ' +
							  'index.html, the single-file build, which needs no server. '
							: '') +
						'Check the browser console for errors.';
					document.body.insertBefore(notice, document.body.firstChild);
				}, 1500);
			});
		</script>
	</head>

<body>

	<input type = "checkbox" id = "showParticles" checked>Particles &nbsp; 
	<input type = "checkbox" id = "showGrid">Grid &nbsp;
	<input type = "checkbox" id = "compensateDrift" checked>Compensate Drift &nbsp;
	<input type = "checkbox" id = "separateParticles" checked>Separate Particles &nbsp;
	PIC
	<input type = "range" min = "0" max = "10" value = "9" class = "slider" id = "flipSlider"> FLIP 
<br>
	<canvas id="myCanvas"></canvas>

	<div id = "settings">
		<div class = "panel-title">Settings</div>
		<div class = "field">
			<label for = "particleSlider">Particle Count</label>
			<span id = "particleValue">26,000</span>
		</div>
		<input type = "range" id = "particleSlider" class = "slider" min = "1000" max = "50000" step = "1000" value = "26000">
		<button id = "applyParticles" class = "button">Apply / Restart</button>
		<div id = "particleActual"></div>
	</div>

	<span id = "version"></span>

	<script type="module" src="src/main.js"></script>
</body>
</html>
